services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
      target: db
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${DJANGO_DATABASE_NAME}
    environment:
      POSTGRES_DB: ${DJANGO_DATABASE_NAME}
      POSTGRES_USER: ${DJANGO_DATABASE_USER}
      POSTGRES_PASSWORD: ${DJANGO_DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DJANGO_DATABASE_USER} -d ${DJANGO_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  django-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: django-docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DJANGO_DEBUG}
      DJANGO_LOGLEVEL: ${DJANGO_LOGLEVEL}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_ENGINE: ${DJANGO_DATABASE_ENGINE}
      DATABASE_NAME: ${DJANGO_DATABASE_NAME}
      DATABASE_USERNAME: ${DJANGO_DATABASE_USER}

      DATABASE_PASSWORD: ${DJANGO_DATABASE_PASSWORD}
      DATABASE_HOST: ${DJANGO_DATABASE_HOST}
      DATABASE_PORT: ${DJANGO_DATABASE_PORT}
    env_file:
      - .env

volumes:
  postgres_data: