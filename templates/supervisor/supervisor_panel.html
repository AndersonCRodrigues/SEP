{% block content %}
<h1>Usuários Cadastrados</h1>

    <a href="{% url 'students:cadastrar' %}">Cadastrar Aluno</a>
    <a href="{% url 'teacher:cadastrar' %}">Cadastrar Professor</a>

<table>
    <thead>
        <tr>
            <th>Nome</th>
            <th>Papel</th>
        </tr>
    </thead>
    <tbody>
        {% for usuario in usuarios_listados %}
        <tr>
            <td>{{ usuario.nome_completo }}</td>
            <td>{{ usuario.get_role_display }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
