{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3 mt-5" id="toastContainer">
  {% for message in messages %}
  <div
    class="toast align-items-center text-bg-{{ message.level_tag }} border-0"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="d-flex">
      <div class="toast-body">{{ message }}</div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        data-bs-dismiss="toast"
        aria-label="Fechar"
      ></button>
    </div>
  </div>
  {% endfor %}
</div>

<script>
  document.querySelectorAll("#toastContainer .toast").forEach(function (el) {
    new bootstrap.Toast(el, { delay: 5000 }).show();
  });
</script>
{% endif %}
