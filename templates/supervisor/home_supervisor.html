{% extends "home.html" %}

{% block home_title %}Coordenação & Supervisão{% endblock %}

{% block home_content %}
<div class="col-12 col-md-6">
    <div class="card h-100">
        <div class="card-body">
            <h2 class="h5 card-title">Coordenação &amp; Supervisão</h2>
            <p class="card-text">Gestão de equipe, usuários e relatórios.</p>
            <div class="d-flex flex-wrap gap-2">
                <a href="{% url 'supervisor:painel' %}" class="btn btn-primary">Acessar Painel do Supervisor</a>
                <a href="{% url 'supervisor:register' %}" class="btn btn-outline-primary">Cadastrar Novo Usuário</a>
                <button type="button" class="btn btn-outline-secondary">Triagem</button>
                <button type="button" class="btn btn-outline-secondary">Estatísticas</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
