{% extends "base.html" %}

{% block title %}Enviar Parecer | Sistema SEP{% endblock %}

{% block content %}
<header class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Enviar Parecer</h1>
    <a href="{% url 'triage_detail' triage.pk %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Voltar pra Triagem
    </a>
</header>

<div class="row">
    <div class="col-12 col-lg-8">
        <section class="card">
            <div class="card-body">
                <p class="text-body-secondary mb-3">Paciente: {{ triage.patient.nome_completo }}</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="content" class="form-label">Parecer</label>
                        <textarea name="content" id="content" class="form-control" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar Parecer</button>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}
