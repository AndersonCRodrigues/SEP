name: Django CI

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      NODE_ENV: dev
      # Os nomes tem de bater com os que config/settings/base.py le, senao o
      # settings cai no sqlite e o servico de Postgres acima fica sem uso.
      DJANGO_DATABASE_ENGINE: django.db.backends.postgresql
      DJANGO_DATABASE_NAME: testdb
      DJANGO_DATABASE_USER: admin
      DJANGO_DATABASE_PASSWORD: adminpassword
      DJANGO_DATABASE_HOST: localhost
      DJANGO_DATABASE_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gera chave de criptografia efemera
        run: |
          KEY=$(python3 -c "import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())")
          echo "FIELD_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Radon
        run: |
          radon cc . -s -a -nb --min B

      - name: Bandit
        run: |
          bandit -r . -x tests,.venv

      # As migrations nao sao versionadas: sem gerar antes, o migrate quebra em
      # "Dependency on app with no migrations: core".
      - name: Executar Migrações
        run: |
          python3 manage.py makemigrations
          python3 manage.py migrate
          python3 manage.py migrate --check

      - name: Pytest
        run: |
          pytest -v