<div class="wizard-mobile-head mobile-only">
  <p class="wizard-mobile-card">
    <span class="wizard-mobile-label">{{ label }}</span>
    <strong class="wizard-mobile-name">{{ name }}</strong>
  </p>
  <progress class="wizard-mobile-progress" value="{{ number }}" max="{{ total }}">{{ number }} de {{ total }}</progress>
</div>
