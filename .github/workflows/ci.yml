name: Django CI

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  quality-check:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Chave nova a cada execucao: o banco do CI e efemero e nada precisa ser
      # decifrado entre rodadas, entao nao ha segredo a guardar nem a vazar.
      - name: Gera chave de criptografia efemera
        run: |
          KEY=$(python -c "import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())")
          echo "FIELD_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Radon
        run: |
          radon cc . -s -a -nb --min B

      - name: Bandit
        run: |
          bandit -r . -x tests,.venv

      - name: Pytest
        run: |
          pytest -v