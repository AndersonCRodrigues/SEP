{% extends "superadmin/base_superadmin.html" %}

{% block title %}Cadastrar Supervisor | Sistema SEP{% endblock %}

{% block content %}
<style>
  /* Banner Oval Vinho */
  .figma-header-banner {
    background-color: #611e25;
    color: #ffffff;
    text-align: center;
    border-radius: 50px;
    padding: 1rem 2rem;
    margin-bottom: 2.5rem;
  }

  .figma-header-banner h1 {
    color: #ffffff !important;
    font-size: 1.75rem;
    font-weight: 700;
    margin: 0;
  }

  /* Centralização e largura do formulário */
  .figma-form-container {
    max-width: 780px;
    margin: 0 auto 3rem auto;
  }

  /* Alerta de erro */
  .figma-error-alert {
    background-color: #fce8e6;
    border: 1px solid #cc2a2a;
    color: #cc2a2a;
    padding: 1rem 1.25rem;
    border-radius: 12px;
    margin-bottom: 1.5rem;
  }

  /* Estilização dos blocos do form.as_p */
  .figma-custom-form p {
    background-color: #e3e3e3;
    border-radius: 14px;
    padding: 0.75rem 1.25rem;
    margin-bottom: 1.25rem;
    display: flex;
    flex-direction: column;
  }

  .figma-custom-form p label {
    font-size: 0.85rem;
    font-weight: 700;
    color: #333333;
    margin-bottom: 0.35rem;
  }

  /* Inputs de texto, email, selects, etc. */
  .figma-custom-form p input[type="text"],
  .figma-custom-form p input[type="email"],
  .figma-custom-form p input[type="tel"],
  .figma-custom-form p input[type="number"],
  .figma-custom-form p input[type="password"],
  .figma-custom-form p select,
  .figma-custom-form p textarea {
    width: 100%;
    border: none !important;
    background: transparent !important;
    font-size: 1rem;
    font-weight: 600;
    color: #1a1a1a;
    outline: none !important;
    padding: 0.2rem 0;
    box-shadow: none !important;
  }

  /* Trata o campo de Áreas de Atuação (Checkboxes) */
  .figma-custom-form p:has(input[type="checkbox"]) {
    background-color: transparent !important;
    padding: 0 !important;
  }

  .figma-custom-form ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .figma-custom-form ul li {
    background-color: #e3e3e3;
    border-radius: 14px;
    padding: 0.85rem 1.25rem;
    margin-bottom: 0.85rem;
    display: flex;
    align-items: center;
  }

  .figma-custom-form ul li label {
    margin: 0 0 0 0.75rem !important;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
  }

  .figma-custom-form input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: #611e25;
    cursor: pointer;
  }

  /* Botão Vinho Centralizado */
  .figma-actions-center {
    display: flex;
    justify-content: center;
    margin-top: 2rem;
  }

  .btn-submit-figma {
    background-color: #611e25;
    color: #ffffff !important;
    font-weight: 700;
    font-size: 1rem;
    padding: 0.85rem 3rem;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.15s ease;
  }

  .btn-submit-figma:hover {
    background-color: #48151b;
    transform: translateY(-1px);
  }
</style>

<!-- Banner Oval do Figma -->
<div class="figma-header-banner">
    <h1>Adicionar supervisor</h1>
</div>

<div class="figma-form-container">
    {% if form.errors %}
        <div class="figma-error-alert">
            <strong>Erros encontrados:</strong>
            {{ form.errors }}
        </div>
    {% endif %}

    <form method="post" class="figma-custom-form">
        {% csrf_token %}
        
        <!-- Renderiza todos os campos (Email, Nome, CPF, Telefone, CRP, Matrícula, Áreas de Atuação) -->
        {{ form.as_p }}

        <div class="figma-actions-center">
            <button type="submit" class="btn-submit-figma">Cadastrar supervisor</button>
        </div>
    </form>
</div>
{% endblock %}
