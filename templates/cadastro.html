{% extends "base.html" %}

{% block title %}Cadastrar Usuário{% endblock %}

{% block content %}
{% if form.errors %}
    <div style="background: #fee; padding: 10px; margin-bottom: 10px;">
        <strong>Erros encontrados:</strong>
        {{ form.errors }}
    </div>
{% endif %}

<h1>Cadastrar Novo Usuário</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Cadastrar</button>
</form>
{% endblock %}
