{% extends "home.html" %}

{% block home_title %}Editar Meus Dados{% endblock %}
<!-- OS DADOS USADOS EU PEGUEI DO POPULAR_USER,OU SEJA NÃO SÃO DADOS REAIS -->
{% block home_content %}
<div class="col-12">
    <section class="card">
        <div class="card-body">
            <h2 class="h5 card-title">Editar meus dados</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a href="{% url 'patient:home' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </a>
                </div>
            </form>
        </div>
    </section>
</div>
{% endblock %}
