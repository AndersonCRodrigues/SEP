{% extends "superadmin/base_superadmin.html" %}
{% load static %}

{% block title %}Meu perfil{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{% static 'core/css/components/list_panel.css' %}">
<link rel="stylesheet" href="{% static 'core/css/form_cadastro.css' %}">
{% endblock %}

{% block content %}
<div class="list-panel-title">Meu perfil</div>

<div class="figma-form-container">
  <form class="figma-custom-form" method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="figma-actions-center">
      <button type="submit" class="btn-submit-figma">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
