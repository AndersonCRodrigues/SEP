{% extends "base.html" %}

{% block title %}Cadastrar Aluno | Sistema SEP{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Cadastrar Aluno</h1>

<div class="row">
    <div class="col-12 col-lg-8">
        <section class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}
