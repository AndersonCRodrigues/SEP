services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
      target: db
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${DJANGO_DATABASE_NAME}
    environment:
      POSTGRES_DB: ${DJANGO_DATABASE_NAME}
      POSTGRES_USER: ${DJANGO_DATABASE_USER}
      POSTGRES_PASSWORD: ${DJANGO_DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DJANGO_DATABASE_USER} -d ${DJANGO_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  django-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: django-docker
    command: >
      sh -c "python3 manage.py makemigrations core areas teacher students patient documents audit triage &&
             python3 manage.py migrate &&
             python3 manage.py populate_users &&
             python3 manage.py setup_roles &&
             python3 manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      DEBUG: ${DJANGO_DEBUG}
      DJANGO_LOGLEVEL: ${DJANGO_LOGLEVEL}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_ENGINE: ${DJANGO_DATABASE_ENGINE}
      DATABASE_NAME: ${DJANGO_DATABASE_NAME}
      DATABASE_USERNAME: ${DJANGO_DATABASE_USER}

      DATABASE_PASSWORD: ${DJANGO_DATABASE_PASSWORD}
      DATABASE_HOST: ${DJANGO_DATABASE_HOST}
      DATABASE_PORT: ${DJANGO_DATABASE_PORT}
    env_file:
      - .env
    volumes:
      - ./templates:/app/templates      # hot-reload de templates sem rebuild
      - ./core/static:/app/core/static  # hot-reload de arquivos estáticos originais
      - staticfiles_data:/app/staticfiles # Persiste os arquivos estáticos processados
      # hot-reload de código Python (sem rebuild a cada mudança)
      - ./core:/app/core
      - ./students:/app/students
      - ./teacher:/app/teacher
      - ./patient:/app/patient
      - ./triage:/app/triage
      - ./supervisor:/app/supervisor
      - ./superadmin:/app/superadmin
      - ./administration:/app/administration
      - ./audit:/app/audit
      - ./areas:/app/areas
      - ./documents:/app/documents
      - ./scheduling:/app/scheduling
      - ./config:/app/config

volumes:
  postgres_data:
  staticfiles_data: