[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py

# As migrations nao sao versionadas: o makemigrations roda no boot do container.
# Num checkout limpo (o CI) so existem os migrations/__init__.py, o que deixa os
# apps classificados como "migrados com zero migrations" -- e a dependencia de
# django.contrib.admin sobre o usuario customizavel nao resolve, derrubando todo
# teste que toca o banco. Com --no-migrations o pytest-django cria as tabelas a
# partir dos models. Remova esta linha quando as migrations forem versionadas.
addopts = --no-migrations
