<section class="card h-100">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
            <h2 class="h5 card-title">{{ title }}</h2>
            {% if action_url %}
            <a href="{{ action_url }}" class="btn btn-sm btn-outline-primary">{{ action_label }}</a>
            {% endif %}
        </div>
        {{ body }}
    </div>
</section>
