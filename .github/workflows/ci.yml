name: Django CI

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_NAME: testdb
      DB_USER: admin
      DB_PASSWORD: adminpassword
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8  # Garante que os linters exigidos estejam instalados

      - name: Formatação (Black)
        run: black --check .

      - name: Linting (Flake8)
        run: flake8 .

      - name: Radon
        run: |
          radon cc . -s -a -nb --min B

      - name: Bandit
        run: |
          bandit -r . -x tests,.venv

      - name: Executar Migrações
        run: python3 manage.py migrate

      - name: Pytest
        run: |
          pytest -v